name: build
on: [push]
jobs:
  build:
    uses: xenoterracide/github/.github/workflows/maven.yml@503e272aeccc16b5999c1497ca7443b622c10578 # develop
    permissions:
      actions: write
      contents: read
      packages: read
  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      packages: write
    concurrency:
      group: publish
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.ref_name }}
          filter: "blob:none"
          fetch-depth: 0
          fetch-tags: true
      - run: git remote set-head --auto origin
      - uses: actions/setup-java@v5.2.0
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
      - run: ./mvnw clean install -DskipTests -q --batch-mode
      - name: compute version
        id: version
        run: |
          VERSION=$(./mvnw exec:java -pl module/semver-cli -Dexec.mainClass=com.xenoterracide.semver.cli.SemverCommand -Dexec.classpathScope=runtime -q | sed 's/^\[INFO\] \[stdout\] //')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: jbangdev/setup-jbang@v0.1.1
      - run: jbang --verbose main.java --help
      - run: jbang --verbose main.java
      - run: ./mvnw clean install -Drevision="${{ steps.version.outputs.version }}" -DskipTests -q --batch-mode
      - name: deploy to github packages
        run: ./mvnw -Drevision="${{ steps.version.outputs.version }}" jreleaser:deploy --batch-mode
        env:
          JRELEASER_GITHUB_TOKEN: ${{ github.token }}
      - name: stage for maven central
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ./mvnw -Drevision="${{ steps.version.outputs.version }}" deploy -DaltDeploymentRepository=local::file:./target/staging-deploy --batch-mode
      - name: create github release and deploy to maven central
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ./mvnw -Drevision="${{ steps.version.outputs.version }}" jreleaser:full-release --batch-mode
        env:
          JRELEASER_GITHUB_TOKEN: ${{ github.token }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
