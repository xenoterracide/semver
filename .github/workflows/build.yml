name: build
on: [push]
jobs:
  build:
    uses: xenoterracide/github/.github/workflows/maven.yml@503e272aeccc16b5999c1497ca7443b622c10578 # develop
    permissions:
      actions: write
      contents: read
      packages: read
  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      packages: write
    concurrency:
      group: publish
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "25"
          distribution: "temurin"
      - run: ./mvnw install -DskipTests -q --batch-mode
      - uses: jbangdev/setup-jbang@2b1b465a7b75f4222b81426f23a01e013aa7b95c # v0.1.1
      - run: jbang main.java --help
      - run: jbang main.java
      - name: deploy to github packages
        run: ./mvnw -Drevision="${{ steps.version.outputs.version }}" jreleaser:deploy --batch-mode
        env:
          JRELEASER_GITHUB_TOKEN: ${{ github.token }}
      - name: stage for maven central
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ./mvnw -Drevision="${{ steps.version.outputs.version }}" deploy -DaltDeploymentRepository=local::file:./target/staging-deploy --batch-mode
      - name: create github release and deploy to maven central
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ./mvnw -Drevision="${{ steps.version.outputs.version }}" jreleaser:full-release --batch-mode
        env:
          JRELEASER_GITHUB_TOKEN: ${{ github.token }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
