name: build
on: [push]
jobs:
  build:
    uses: xenoterracide/github/.github/workflows/maven.yml@5484c5262d9bc4c406b0fbf8c0bbeff07ba8643c # develop
    permissions:
      actions: write
      contents: read
      packages: read
  jbang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "25"
          distribution: "temurin"
      - run: ./mvnw install -DskipTests -q --batch-mode
      - uses: jbangdev/setup-jbang@2b1b465a7b75f4222b81426f23a01e013aa7b95c # v0.1.1
      - run: jbang main.java --help
      - run: jbang main.java
