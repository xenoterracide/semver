name: build
on: [push, workflow_dispatch]
jobs:
  build:
    uses: xenoterracide/github/.github/workflows/maven.yml@94b67449fc788e5c919680df100075e92fa446f1 # develop
    permissions:
      actions: write
      contents: read
      packages: read
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    concurrency:
      group: publish
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          filter: "blob:none"
          fetch-depth: 0
          fetch-tags: true
      - run: git remote set-head --auto origin
      - uses: actions/setup-java@v6
        with:
          java-version: "25.0.5+8.0.LTS"
          distribution: "temurin"
          cache: maven
      - uses: jbangdev/setup-jbang@v0.1.1
      - name: Configure Maven settings for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>gh</id>
                <username>${{ github.actor }}</username>
                <password>${{ github.token }}</password>
              </server>
            </servers>
          </settings>
          EOF
      - run: echo "${{ secrets.GPG_SECRET_KEY }}" | gpg --batch --import
      - run: ./mvnw -B -q --no-transfer-progress -DskipTests -DskipITs install
      - run: echo "VERSION=$(jbang --quiet main.java)" >> "$GITHUB_ENV"
      - run: ./mvnw -B -q --no-transfer-progress versions:set -DnewVersion="$VERSION" -DprocessAllModules -DgenerateBackupPoms=false
      - name: deploy (arbitrated by post-publish checks)
        # GHP intermittently rejects Maven 4's build-classifier pom with 409
        # after every artifact already landed. Retrying re-uploads existing
        # artifacts, which 409s for real — so retries cannot recover. One
        # retry covers failures where nothing landed; after that, fall
        # through and let the post-publish consumability checks decide:
        # they fail the job iff this version is not actually published.
        run: |
          if ./mvnw -B -q --no-transfer-progress -DskipTests -DskipITs -Psign clean deploy -Dgpg.passphrase="$GPG_PASSPHRASE"; then
            exit 0
          fi
          sleep 30
          ./mvnw -B -q --no-transfer-progress -DskipTests -DskipITs -Psign clean deploy -Dgpg.passphrase="$GPG_PASSPHRASE" \
            || echo "deploy failed; post-publish checks will arbitrate"
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - run: git restore .
      - name: isolate local maven repository for consumability check
        run: rm -rf ~/.m2/repository/com/xenoterracide
      - name: Verify published artifact is consumable
        run: |
          test "$(jbang --quiet --repos=gh=https://maven.pkg.github.com/xenoterracide/semver "com.xenoterracide:semver-cli:$VERSION")" = "$VERSION"
      - name: verify deployed version in repository metadata
        run: >
          curl -sf -H "Authorization: Bearer $GITHUB_TOKEN"
          "https://maven.pkg.github.com/xenoterracide/semver/com/xenoterracide/semver-cli/maven-metadata.xml"
          | grep -q "<version>$VERSION</version>"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag module/*/target/*.jar
        env:
          GH_TOKEN: ${{ github.token }}
