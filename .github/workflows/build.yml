name: build
on: [push]
jobs:
  build:
    uses: xenoterracide/github/.github/workflows/maven.yml@45fc25e664cd989ac99ab51b4ef28daf6c987ff3 # develop
    permissions:
      actions: write
      contents: read
      packages: read
  jbang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "25.0.4+101.0.LTS"
          distribution: "temurin"
      - run: ./mvnw install -DskipTests -q --batch-mode
      - uses: jbangdev/setup-jbang@2b1b465a7b75f4222b81426f23a01e013aa7b95c # v0.1.1
      - run: jbang main.java --help
      - run: jbang main.java
